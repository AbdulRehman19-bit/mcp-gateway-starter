# Alembic config for the GATEWAY database (audit_log, approvals). Not the target DB.
# Run as the schema owner, never as an app role:
#   GATEWAY_DB_ADMIN_URL=postgresql+asyncpg://postgres:postgres-dev-only@localhost:5432/gateway \
#     uv run alembic upgrade head
[alembic]
script_location = migrations
# The URL comes from GATEWAY_DB_ADMIN_URL (see migrations/env.py); no credentials live here.

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(message)s
