# Example policy. Copy to policies/dev.local.yaml for local changes (git-ignored).
# Principle: default deny. Anything not listed here is not allowed.
version: 1

defaults:
  read_only: true            # roles are read-only unless they say otherwise
  max_rows: 500              # hard cap on rows returned by run_query
  statement_timeout_ms: 5000

# Which tools exist and how risky they are.
risk:
  low: [list_tables, describe_table, run_query, github_list_issues, github_get_issue]
  medium: [update_record]            # bounded write: single row, by primary key
  high: [delete_record, bulk_update, github_add_comment]  # always needs human approval

# Second connector: GitHub, read-mostly. Only these repositories can ever be reached; the
# comment tool is high risk (it can publish data outside the gateway), so a different human
# must approve each one. Set GITHUB_TOKEN (fine-grained PAT, Issues access on these repos only).
connectors:
  github:
    repos: ["octocat/Hello-World"]
    max_text_chars: 4000             # issue/comment text returned to the client is cut here

approvals:
  ttl_minutes: 30
  require_different_approver: true

# Per-user, per-tool rate limits (token buckets, in-memory). Over the limit the call is denied
# and audited as rate_limited. Anything not listed uses `default`.
limits:
  default: {per_minute: 120, burst: 30}
  tools:
    run_query: {per_minute: 60, burst: 20}
    update_record: {per_minute: 20, burst: 5}
    delete_record: {per_minute: 10, burst: 10}     # also covers dry_run and approval retries
    decide_approval: {per_minute: 30, burst: 10}
    github_list_issues: {per_minute: 30, burst: 10}
    github_get_issue: {per_minute: 60, burst: 20}
    github_add_comment: {per_minute: 5, burst: 5}

# OAuth scope -> role. The role is derived from the validated token, never from tool args.
scope_to_role:
  "db:read": analyst
  "db:write": operator
  "approvals:decide": approver

roles:
  analyst:
    read_only: true
    tools: [list_tables, describe_table, run_query, github_list_issues, github_get_issue]
    schemas:
      public:
        tables:
          orders:
            columns: ["*"]
          customers:
            columns: [id, name, country, created_at]
          users:
            columns: ["*"]
            deny_columns: [email, password_hash]   # never readable
            mask_columns: [phone]                  # returned as "***"

  operator:
    read_only: false
    tools: [list_tables, describe_table, run_query, update_record, delete_record,
            github_list_issues, github_get_issue, github_add_comment]
    approval_required: []        # medium-risk writes are allowed directly; high always needs approval
    schemas:
      public:
        tables:
          orders:
            columns: ["*"]
            writable_columns: [status, notes]   # update_record may only touch these
            deletable: true                     # delete_record allowed here (needs approval)
          customers:
            columns: [id, name, country, created_at]

  approver:
    read_only: true
    tools: [list_approvals, decide_approval]
    approves_roles: [operator]       # may list and decide requests made by operators only
    schemas: {}
